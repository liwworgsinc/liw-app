<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151955">
  <title>Sign In | LIW Worgs Inc.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar liw-navbar"><div class="container"><a class="navbar-brand liw-brand" href="index.html"><img src="assets/liw-worgs-logo.png" alt="LIW Worgs Inc."></a><a class="btn btn-outline-liw" href="register.html">Create Account</a></div></nav>
  <main class="auth-shell">
    <div class="container"><div class="liw-card auth-card mx-auto">
      <img class="auth-logo" src="assets/liw-worgs-logo.png" alt="LIW Worgs Inc.">
      <div class="text-center mb-4"><h1 class="h3 fw-bold">Welcome back</h1><p class="text-secondary">Sign in to your LIW client portal.</p></div>
      <form id="loginForm" novalidate>
        <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="mb-2"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
        <div class="text-end mb-4"><button class="btn btn-link p-0 text-decoration-none" id="forgotPassword" type="button">Forgot password?</button></div>
        <button class="btn btn-liw btn-lg w-100" type="submit">Sign In</button>
      </form>
      <p class="text-center text-secondary mt-4 mb-0">New to LIW? <a class="fw-bold" href="register.html">Create an account</a></p>
      <p class="text-center mt-3 mb-0"><a class="text-decoration-none" href="index.html"><i class="bi bi-arrow-left"></i> Back to website</a></p>
    </div></div>
  </main>
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-box"><div class="spinner-border text-primary"></div><strong data-loading-message>Working…</strong></div></div>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/config.js"></script><script defer src="js/common.js"></script><script defer src="js/auth.js"></script>
</body>
</html>
