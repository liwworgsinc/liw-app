<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151955">
  <title>Reset Password | LIW Worgs Inc.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet">

<body>
  <nav class="navbar liw-navbar"><div class="container"><a class="navbar-brand liw-brand" href="index.html"><img src="assets/liw-worgs-logo.png" alt="LIW Worgs Inc."></a></div></nav>
  <main class="auth-shell"><div class="container"><div class="liw-card auth-card mx-auto"><img class="auth-logo" src="assets/liw-worgs-logo.png" alt="LIW Worgs Inc."><div class="text-center mb-4"><h1 class="h3 fw-bold">Choose a new password</h1><p class="text-secondary">Enter a secure password for your LIW account.</p></div><div id="resetMessage"></div><form id="resetPasswordForm"><div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="mb-4"><label class="form-label" for="confirmPassword">Confirm new password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-liw btn-lg w-100" type="submit">Update Password</button></form></div></div></main>
  <div class="loading-overlay" id="loadingOverlay"><div class="loading-box"><div class="spinner-border text-primary"></div><strong data-loading-message>Working…</strong></div></div>
